yellowColor = "#8A6D1F"
redColor = "#A34B3F"
blueColor = "#2C6B82"
violetColor = "#6B5A8E"
grayColor = "#6B6F76"

dataframeBorderColor = "#DDD9D2"
dataframeHeaderBackgroundColor = "#F2F0EC"

chartCategoricalColors = [
