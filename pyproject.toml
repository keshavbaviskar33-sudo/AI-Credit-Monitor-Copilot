[project]
name = "credit-risk-copilot"
version = "0.1.0"
description = "Human-in-the-loop credit monitoring copilot for credit analysts"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Proprietary" }
authors = [{ name = "Keshav Baviskar", email = "keshavbaviskar33@gmail.com" }]

# Core dependencies needed from Phase 2 onward: SEC API access, config and
# data handling. Phase-specific dependencies live in optional groups below so
# each phase installs only what it needs (see README "Environment setup").
dependencies = [
    "pandas>=2.2,<3.1",
    "numpy>=1.26,<2.6",
    "requests>=2.32,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
    "truststore>=0.9,<1",
]

[project.optional-dependencies]
# Phase 8-9: baseline ML model and explainability.
ml = ["scikit-learn>=1.5,<1.10", "shap>=0.46,<0.53"]
# Phase 4-5: document extraction (text-based PDFs) and XBRL/HTML parsing.
pdf = ["pdfplumber>=0.11,<0.12", "pymupdf>=1.24,<1.29", "lxml>=5.3,<7"]
# Phase 14 (proposed initial choice, see decision_log.md D-012): dashboard UI.
ui = ["streamlit>=1.38,<1.64"]
# Phase 13/15: append-only SQLite persistence.
db = ["sqlalchemy>=2.0,<2.1"]
# Engineering tooling: tests and linting, used from Phase 2 onward.
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<0.15",
    "mypy>=1.11,<1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=credit_risk_copilot --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["credit_risk_copilot"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["credit_risk_copilot"]
strict = true
warn_unused_ignores = true
# Third-party libraries without bundled type stubs.
[[tool.mypy.overrides]]
module = ["shap.*", "pdfplumber.*", "pymupdf.*", "fitz.*", "lxml.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true

# pymupdf ships no annotations, so every Story/DocumentWriter call reads as
# untyped. This module is the only place that touches that API.
[[tool.mypy.overrides]]
module = ["credit_risk_copilot.extraction.render"]
disallow_untyped_calls = false
